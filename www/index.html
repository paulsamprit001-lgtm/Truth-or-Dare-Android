<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Truth or Dare</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101114;color:#f5f5f5;font:16px system-ui;display:grid;place-items:center;padding:22px}.app{width:min(100%,460px)}h1{text-align:center;font-size:32px;margin:10px 0 6px}.sub{text-align:center;color:#a8abb3;margin:0 0 30px}.panel{background:#1b1d23;border:1px solid #30333b;border-radius:22px;padding:22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}.prompt{font-size:22px;line-height:1.4}.muted{color:#a8abb3;font-size:14px;margin-top:16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.btn{border:0;border-radius:14px;padding:17px 12px;font-size:17px;font-weight:750;color:#fff;background:#5650d8}.btn.dare{background:#e34f75}.btn.next{width:100%;background:#30343d}.btn:active{transform:scale(.98)}.foot{text-align:center;color:#858995;font-size:12px;margin-top:18px}</style></head><body><main class="app"><h1>TRUTH OR DARE</h1><p class="sub">Good vibes. Harmless fun.</p><section class="panel"><div class="prompt" id="prompt">Choose Truth or Dare to get started.</div><div class="muted" id="hint">You can always skip a prompt.</div></section><div class="buttons"><button class="btn" onclick="pick('truth')">TRUTH</button><button class="btn dare" onclick="pick('dare')">DARE</button></div><button class="btn next" onclick="next()">Another prompt</button><p class="foot">Keep it kind • Keep it safe • Respect every skip</p></main><script>const truths=["What is a small thing that always makes you happy?","What is a skill you would love to learn?","What is your funniest school memory?","What is one thing you are proud of?","If you could visit anywhere, where would you go?","What is a kind thing someone did for you?","What is your favourite comfort food?","Which fictional world would you visit for a day?","What is a silly fear you have?","What song instantly improves your mood?","What is one goal you are excited about?","What is the best advice you have received?"];const dares=["Do your best robot dance for 15 seconds.","Speak like a sports commentator for one minute.","Make up a silly two-line poem.","Draw a cat in 20 seconds.","Try to say a tongue twister three times.","Give everyone in the room a genuine compliment.","Hum a tune and let others guess it.","Balance a cushion on your head for 10 seconds.","Invent a new handshake in the air.","Do your best superhero pose.","Describe your day using only three words.","Make a funny face for five seconds."];let last="";function pick(type){const list=type==="truth"?truths:dares;let p=list[Math.floor(Math.random()*list.length)];if(list.length>1)while(p===last)p=list[Math.floor(Math.random()*list.length)];last=p;document.getElementById("prompt").textContent=p;document.getElementById("hint").textContent=type==="truth"?"TRUTH":"DARE"}function next(){pick(Math.random()<.5?"truth":"dare")}</script></body></html>
